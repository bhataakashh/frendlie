<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frendlie</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#e8186d;--bg2:#7a3fe0;--card:#fff;--txt:#2b1230;--mut:#7d6a82;--btn:#ff4f6d;--line:#f0dbe8;--in:#fff4f9}
@media (prefers-color-scheme:dark){:root{--card:#2a1630;--txt:#f7eaf4;--mut:#bba3c0;--line:#44284d;--in:#35193d}}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Fredoka',system-ui,-apple-system,sans-serif;background:#b0207a linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--txt)}
#app{max-width:480px;margin:0 auto;padding:14px 14px 150px}
.top{display:flex;justify-content:center;align-items:center;gap:8px;margin:6px 0 14px;position:relative}
.logo{width:100px;height:100px;object-fit:contain;background:#fff;border-radius:24px;padding:7px;display:block}
.bell{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--card);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 16px #0003;cursor:pointer;border:0}
.dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#ff3b3b;border:2px solid var(--card)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 10px 30px #0003;margin-bottom:14px}
h2{margin:0 0 10px;font-size:22px;font-weight:600}p{line-height:1.5}
input,select,textarea{width:100%;padding:12px 14px;margin:6px 0;border:2px solid var(--line);border-radius:14px;background:var(--in);color:var(--txt);font:inherit;font-size:16px}
.btn{display:inline-block;border:0;border-radius:16px;padding:13px 20px;background:var(--btn);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-align:center}
.btn.g{background:var(--in);color:var(--txt);border:2px solid var(--line)}.btn.sm{padding:8px 14px;font-size:14px}.w{width:100%}
.err{color:#d6204a;font-size:14px;min-height:20px}
.row{display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tabs .btn{flex:1;padding:10px}
nav{position:fixed;left:0;right:0;bottom:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);display:flex;box-shadow:0 -4px 20px #0003;overflow-x:auto;gap:2px}
nav button{flex:1 0 auto;min-width:58px;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font:inherit;font-size:10px;cursor:pointer;border-radius:12px}
nav button.on{color:var(--btn);background:var(--in)}nav button .ic{font-size:19px}
.note{background:var(--in);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.av{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#ff8fb3,#b388ff);overflow:hidden;flex:none}
.av.s{width:54px;height:54px;font-size:28px;margin:0}.av img{width:100%;height:100%;object-fit:cover}
.msgs{height:46dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--in);word-wrap:break-word;align-self:flex-start}
.m.me{align-self:flex-end;background:var(--btn);color:#fff}.m img{max-width:100%;border-radius:12px;display:block}
.m.sys{align-self:center;background:transparent;color:var(--mut);font-size:12px}
.rp{font-size:11px;color:var(--mut);cursor:pointer;margin-top:4px}
.prot{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.prot img{pointer-events:none}
body.away .prot img{filter:blur(30px)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal .card{max-width:420px;max-height:82dvh;overflow:auto;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#2b1230;color:#fff;padding:10px 18px;border-radius:20px;z-index:10;font-size:14px;max-width:90%}
a{color:var(--btn)}
.chip{display:inline-block;padding:7px 13px;border-radius:14px;border:2px solid var(--line);background:var(--in);font-size:13px;cursor:pointer;margin:3px}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.nitem{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:0}.nitem .ic{font-size:22px;width:34px;text-align:center;flex:none}
.pill{font-size:11px;background:var(--btn);color:#fff;border-radius:10px;padding:2px 8px}
.callbar{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.callbar .av{width:130px;height:130px;font-size:60px;margin-bottom:16px}
.pulse{animation:p 1.4s infinite}@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
audio{display:none}
</style>
</head>

const NUM=new RegExp(D+'(\\D{0,2}'+D+'){7,}');
const CON=/[\w.+-]+\s*(@|\(at\)|\[at\])\s*[\w-]+|\b(gmail|yahoo|hotmail|outlook)\b|\b(insta(gram)?|snap(chat)?|whats\s?-?app|watsapp|telegram|facebook|fb|wa\.me|t\.me)\b|@\w{3,}/i;
const ASK=/\b(your|ur|tumhara|aapka|apna|tera|teri|share|send|give|dena|dedo|bhejo|batao)\b.{0,20}\b(number|nambar|mobile\s?no|phone\s?no|contact)\b|\b(number|nambar|mobile\s?no|contact)\s*(do|de|dena|dedo|bhejo|batao|please|pls|plz)\b/i;
const AB=/\b(fuck|shit|bitch|asshole|bastard|slut|whore|cunt|dick|madarchod|behenchod|bhenchod|bhosdi|chutiya|gandu|gaand|harami|randi|lund|kutta|kamina|mc|bc)\b/i;
const LONG=['fuck','bitch','asshole','madarchod','behenchod','bhenchod','bhosdi','chutiya'];
function check(t){const n=t.normalize('NFKC');
  if(NUM.test(n)||CON.test(n)||ASK.test(n))return'c';
  const l=n.toLowerCase().replace(/[@4]/g,'a').replace(/0/g,'o').replace(/[1!]/g,'i').replace(/3/g,'e').replace(/\$/g,'s'),f=l.replace(/[^a-z]/g,'');
  return(AB.test(l)||LONG.some(w=>f.includes(w)))?'a':null}
async function pause(){ME.blockUntil=Date.now()+300000;ME.cs=0;await updateDoc(doc(db,'priv',ME.uid),{blockUntil:ME.blockUntil,cs:0})}
async function guard(t,q){const r=check(t);if(!r)return true;const i=$(q);if(i)i.value='';
  if(r==='c'){ME.cs=(ME.cs||0)+1;
    if(ME.cs>=2){await pause();render();warn('Your message was deleted. You tried to share contact details again, so your account is paused for 5 minutes.')}
    else{updateDoc(doc(db,'priv',ME.uid),{cs:ME.cs});warn('Your message was deleted. Sharing phone numbers, email or social IDs is not allowed. If you do it one more time, your account will be paused for 5 minutes.')}
    return false}
  await pause();render();warn('Your message was deleted. Abusive language is not allowed, so your account is paused for 5 minutes.');return false}

function drawImg(src,max,cb,fail){const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.onerror=fail;i.src=src}
function loadHeic(){return new Promise((ok,no)=>{if(window.heic2any)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function readImg(f,max,cb){const bad=()=>toast('Could not read that photo. Please try another one (JPG or PNG).'),r=new FileReader();
  r.onload=()=>drawImg(r.result,max,cb,()=>{toast('Converting your photo...');
    loadHeic().then(()=>heic2any({blob:f,toType:'image/jpeg',quality:.8})).then(b=>{const r2=new FileReader();r2.onload=()=>drawImg(r2.result,max,cb,bad);r2.onerror=bad;r2.readAsDataURL(Array.isArray(b)?b[0]:b)}).catch(bad)});
  r.onerror=()=>toast('Could not open that file');r.readAsDataURL(f)}
function pickFile(accept,cb){document.querySelectorAll('.tmpf').forEach(x=>x.remove());
  const i=document.createElement('input');i.type='file';i.accept=accept;i.className='tmpf';i.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(i);i.addEventListener('change',()=>{const f=i.files&&i.files[0];i.remove();if(f)cb(f)});i.click()}

/* ---------- Voice call (1-to-1, WebRTC with free STUN; Realtime Database only carries the connection setup) ---------- */
const RTC_CFG={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
const roomOf=(a,b)=>[a,b].sort().join('_');
function listenCalls(){unCall&&unCall();
  unCall=onValue(ref(rtdb,'calls/'+ME.uid),async snap=>{
    const v=snap.val();if(!v)return;
    if(Date.now()-(v.ts||0)>60000){remove(ref(rtdb,'calls/'+ME.uid)).catch(()=>{});return}
    if(v.state==='ringing'&&!call){await need([v.from]);
      call={room:v.room,peer:v.from,role:'callee',state:'ringing'};render()}
    else if(v.state==='accepted'&&call&&call.room===v.room&&call.role==='caller'&&call.state==='calling'){
      clearTimeout(callTimer);call.state='connecting';render();remove(ref(rtdb,'calls/'+ME.uid)).catch(()=>{});await startPeer(true)}
    else if(v.state==='ended'&&call&&call.room===v.room){remove(ref(rtdb,'calls/'+ME.uid)).catch(()=>{});endCall(false)}
  },e=>toast('Call service: '+(e.code||e.message)))}
async function requestCall(peer){
  if(call)return toast('You are already in a call');
  const room=roomOf(ME.uid,peer);
  call={room,peer,role:'caller',state:'calling'};render();
  try{await remove(ref(rtdb,'sig/'+room)).catch(()=>{});
    await set(ref(rtdb,'calls/'+peer),{state:'ringing',from:ME.uid,room,ts:Date.now()});
    notify(peer,'call',{}).catch(()=>{});
    callTimer=setTimeout(()=>{if(call&&call.state==='calling'){toast('No answer');endCall(true)}},45000)}
  catch(e){toast('Could not start the call: '+(e.code||e.message));endCall(false)}}
async function acceptCall(){if(!call||call.role!=='callee')return;
  call.state='connecting';render();
  remove(ref(rtdb,'calls/'+ME.uid)).catch(()=>{});
  await set(ref(rtdb,'calls/'+call.peer),{state:'accepted',from:ME.uid,room:call.room,ts:Date.now()});
  await startPeer(false)}
async function declineCall(){if(!call)return;
  remove(ref(rtdb,'calls/'+ME.uid)).catch(()=>{});
  await set(ref(rtdb,'calls/'+call.peer),{state:'ended',from:ME.uid,room:call.room,ts:Date.now()}).catch(()=>{});
  endCall(false)}
async function startPeer(isCaller){
  const sig='sig/'+call.room;
  try{localStream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){toast('Microphone permission is needed for calls. Allow it in your browser settings.');return endCall(true)}
  const me=new RTCPeerConnection(RTC_CFG);pc=me;
  const pend=[],seen=new Set();let remoteSet=false;
  localStream.getTracks().forEach(t=>me.addTrack(t,localStream));
  me.ontrack=e=>{let a=$('#remoteAudio');if(!a){a=document.createElement('audio');a.id='remoteAudio';a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}
    a.srcObject=e.streams[0];const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})};
  me.onicecandidate=e=>{if(e.candidate)push(ref(rtdb,sig+'/'+(isCaller?'callerIce':'calleeIce')),e.candidate.toJSON())};
  const addIce=c=>{const k=JSON.stringify(c);if(seen.has(k))return;seen.add(k);
    if(remoteSet)me.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});else pend.push(c)};
  const flush=()=>{remoteSet=true;pend.splice(0).forEach(c=>me.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}))};
  sigUn.push(onValue(ref(rtdb,sig+'/'+(isCaller?'calleeIce':'callerIce')),s=>{const v=s.val();if(v)Object.values(v).forEach(addIce)}));
  me.onconnectionstatechange=()=>{if(me===pc&&me.connectionState==='failed'){toast('Call could not connect on this network');endCall(true)}};
  let got=false;
  if(isCaller){
    const offer=await me.createOffer();await me.setLocalDescription(offer);
    await set(ref(rtdb,sig+'/offer'),{sdp:offer.sdp,type:offer.type});
    sigUn.push(onValue(ref(rtdb,sig+'/answer'),async s=>{const v=s.val();if(!v||got||me!==pc)return;got=true;
      await me.setRemoteDescription(new RTCSessionDescription(v));flush();call.state='connected';call.t0=Date.now();render()}))}
  else{
    sigUn.push(onValue(ref(rtdb,sig+'/offer'),async s=>{const v=s.val();if(!v||got||me!==pc)return;got=true;
      await me.setRemoteDescription(new RTCSessionDescription(v));flush();
      const an=await me.createAnswer();await me.setLocalDescription(an);
      await set(ref(rtdb,sig+'/answer'),{sdp:an.sdp,type:an.type});call.state='connected';call.t0=Date.now();render()}))}}
function endCall(tellPeer){
  const had=call;
  if(had&&tellPeer&&ME)set(ref(rtdb,'calls/'+had.peer),{state:'ended',from:ME.uid,room:had.room,ts:Date.now()}).catch(()=>{});
  if(had)remove(ref(rtdb,'sig/'+had.room)).catch(()=>{});
  sigUn.splice(0).forEach(f=>{try{f()}catch(e){}});
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  document.querySelectorAll('#remoteAudio').forEach(x=>x.remove());
  clearTimeout(callTimer);call=null;if(had&&ME)render()}
function muteToggle(){if(!localStream)return;const t=localStream.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;call.muted=!t.enabled;render()}

const IC={like:'♥',match:'🎉',call:'📞',group:'👥'};
return `<div class="card"><h2>Notifications</h2>${NOTIFS.map(n=>{const p=P(n.from),t=(T[n.type]||(()=>'New activity'))(p);
const act=n.type==='like'&&!MY.likes.has(n.from)?`<button class="btn sm" data-a="like" data-v="${n.from}">Connect back</button>`:n.type==='match'?`<button class="btn sm g" data-a="tab" data-v="chats">Chat</button>`:n.type==='group'?`<button class="btn sm g" data-a="tab" data-v="groups">Open</button>`:'';
return `<div class="nitem"><div class="ic">${IC[n.type]||'🔔'}</div><div style="flex:1">${t}${n.read?'':' <span class="pill">new</span>'}<div style="font-size:12px;color:var(--mut)">${timeAgo(n.ts)}</div></div>${act}</div>`}).join('')}</div>`}

function safetyHtml(){
return `<div class="card"><h2>🛡️ Safety Center</h2><p style="color:var(--mut);font-size:14px">Frendlie is about genuine connections. Here is how we keep it safe and what you can do.</p>
<ul style="padding-left:18px;line-height:1.7;font-size:15px"><li>Never share your phone number, email, social IDs or exact address. Such messages are deleted automatically.</li><li>Your exact location is never collected. Only your city is shown.</li><li>Voice calls start only if the other person accepts, and you can end or decline any time.</li><li>Do not send money or share OTPs and passwords with anyone.</li><li>Meet only in public places, and tell a family member or friend first.</li><li>Abusive language is deleted and pauses the account for 5 minutes.</li></ul>
<div class="note">In an emergency, call <b>112</b> (India emergency number).</div></div>
<div class="card"><h2>Report a problem</h2><select id="rr">${opts(['Harassment or abuse','Fake profile','Asking for contact details','Inappropriate photo','Something else'])}</select>
<textarea id="rt" rows="3" maxlength="500" placeholder="Tell us what happened (do not include passwords)"></textarea><div class="err" id="err"></div><button class="btn w" data-a="sendrep">Send report</button></div>
<div class="card"><button class="btn g w" data-a="policy">Read the Privacy Policy</button></div>`}

function meHtml(){const mi=ME.interests||[];
return `<div class="card prot" style="text-align:center">${avHtml(ME)}<b style="font-size:20px">${esc(ME.name)}, ${ME.age}</b><div style="color:var(--mut)">${esc(ME.email)}</div></div>
<div class="card"><h2>Your profile</h2><div style="font-size:14px;color:var(--mut)">Pick an avatar or upload your own photo. Photos are protected: no download, no right-click, hidden when you switch apps. Profiles with a photo get more visibility.</div>
<div class="row" style="flex-wrap:wrap;margin:10px 0">${AV.map(a=>`<button class="btn g sm" style="font-size:22px" data-a="av" data-v="${a}">${a}</button>`).join('')}</div>
<button class="btn g w" data-a="pickph">📷 Upload photo from gallery</button>
${ME.photo?'<button class="btn g w" style="margin-top:8px" data-a="rmph">Remove photo</button>':''}
<textarea id="bio" rows="3" maxlength="500" placeholder="About me (up to 500 characters)">${esc(ME.bio)}</textarea>
<label style="font-size:14px;color:var(--mut)">Your interests (pick up to 5)</label><div style="margin:6px 0">${chips(INTERESTS,i=>mi.includes(i),'ti')}</div>
<select id="pc">${opts(CITIES,ME.city)}</select>
<label style="font-size:14px;color:var(--mut)">Show me</label><select id="sh">${opts([['All','Everyone'],['Woman','Women'],['Man','Men']],ME.show)}</select>
<button class="btn w" style="margin-top:8px" data-a="savep">Save profile</button></div>
<div class="card"><h2>Settings</h2><button class="btn g w" data-a="policy">Privacy Policy</button>
<button class="btn g w" style="margin-top:8px" data-a="logout">Log out</button>
<button class="btn g w" style="margin-top:8px;color:#d6204a" data-a="del">Delete my account and data</button></div>`}

function blockHtml(){return `${logoTop()}<div class="card" style="text-align:center"><h2>Account paused ⏸️</h2><p>Sharing or asking for personal contact details, or using abusive language, is against our privacy policy.</p><div style="font-size:44px;font-weight:600" id="cd">${fmt(Math.ceil((ME.blockUntil-Date.now())/1000))}</div><p>You can use Frendlie again when the timer ends.</p></div>`}

function callHtml(){const p=P(call.peer);let st,btns;
if(call.role==='caller'&&call.state==='calling'){st='Calling...';btns=`<button class="btn" style="background:#d6204a" data-a="ecall">Cancel</button>`}
else if(call.role==='callee'&&call.state==='ringing'){st='Incoming voice call';btns=`<div class="row"><button class="btn" style="background:#d6204a" data-a="dcall">Decline</button><button class="btn" style="background:#1fa971" data-a="acall">Accept</button></div>`}
else if(call.state==='connected'){st=`Connected · <span id="ct">${fmt(Math.floor((Date.now()-(call.t0||Date.now()))/1000))}</span>`;btns=`<div class="row"><button class="btn g" data-a="mute">${call.muted?'Unmute':'Mute'}</button><button class="btn" style="background:#d6204a" data-a="ecall">End</button></div>`}
else{st='Connecting...';btns=`<button class="btn" style="background:#d6204a" data-a="ecall">End</button>`}
return `<div class="callbar"><div class="pulse">${avHtml(p)}</div><h2 style="margin:0">${esc(p.name)}</h2><p>${st}</p>${btns}<p style="font-size:12px;opacity:.85;margin-top:18px">Voice only. This call is private between you two.</p></div>`}

function page(){clearInterval(timer);const app=$('#app');
if(!ME){app.innerHTML=authHtml();return}
if(ME.blockUntil>Date.now()){app.innerHTML=blockHtml();timer=setInterval(()=>{const s=Math.ceil((ME.blockUntil-Date.now())/1000);if(s<=0)render();else if($('#cd'))$('#cd').textContent=fmt(s)},1000);return}
if(chat||grp){app.innerHTML=chat?chatHtml():grpHtml();const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;return}
const B=({home:homeHtml,disc:discHtml,chats:chatsHtml,groups:groupsHtml,gnew:gnewHtml,alerts:alertsHtml,safety:safetyHtml,me:meHtml}[tab]||homeHtml)(),un=unreadCount();
app.innerHTML=`${logoTop()}${B}<nav>${NAV.map(([k,ic,l])=>`<button class="${(tab===k||(k==='groups'&&tab==='gnew'))?'on':''}" data-a="tab" data-v="${k}"><span class="ic">${ic}</span>${l}${k==='alerts'&&un?` <span class="pill">${un}</span>`:''}</button>`).join('')}</nav>`}
function render(){page();document.querySelectorAll('.callbar').forEach(x=>x.remove());clearInterval(ctimer);
if(ME&&call){document.body.insertAdjacentHTML('beforeend',callHtml());
if(call.state==='connected')ctimer=setInterval(()=>{const e=$('#ct');if(e)e.textContent=fmt(Math.floor((Date.now()-call.t0)/1000))},1000)}}
function rr(){const a=$('#gt')||$('#t')||$('#dq'),v=a?a.value:'',id=a?a.id:'';render();if(id&&$('#'+id))$('#'+id).value=v}
function syncP(){if(!ME||!$('#bio'))return;ME.bio=$('#bio').value;ME.city=$('#pc').value;ME.show=$('#sh').value}

/* ---------- Auth ---------- */
async function signup(){const v=i=>$('#'+i).value.trim(),name=v('n'),email=v('e').toLowerCase(),pw=$('#p').value,dob=$('#d').value;
  if(!name||!email||!pw||!dob)return err('Please fill in every field.');
  if(!/^\S+@\S+\.\S+$/.test(email))return err('Enter a valid email address.');
  if(pw.length<6)return err('Password must have at least 6 characters.');
  const a=age(dob);if(a<0||a>100)return err('Enter a valid date of birth.');
  if(a<18)return err('You are under 18. You cannot create an account on Frendlie.');
  signing=true;
  try{const c=await createUserWithEmailAndPassword(auth,email,pw),uid=c.user.uid,gender=$('#g').value,city=$('#c').value;
    const pub={name,age:a,gender,city,bio:'',av:'🦋',photo:'',show:'All',interests:[]},priv={dob,email,blockUntil:0,cs:0};
    await setDoc(doc(db,'users',uid),pub);await setDoc(doc(db,'priv',uid),priv);
    ME={uid,...pub,...priv};await boot();await loadAnswers().catch(()=>{});signing=false;tab='me';render();
    modal(`<div style="text-align:center"><div style="font-size:44px">📧</div><h2>Welcome to Frendlie!</h2><p>Confirmation card for <b>${esc(email)}</b></p><p>You are now a member of the Frendlie friendship space. Add a photo and a few interests to meet people who share them. 🌸</p></div>`,'Continue')
  }catch(e){signing=false;err(authErr(e))}}
async function login(){const email=$('#e').value.trim().toLowerCase(),pw=$('#p').value;
  if(!email||!pw)return err('Enter your email and password.');
  try{await signInWithEmailAndPassword(auth,email,pw)}catch(e){err(authErr(e))}}
onAuthStateChanged(auth,async u=>{if(signing)return;
  if(!u){stopAll();ME=null;render();return}
  try{const [p,v]=await Promise.all([getDoc(doc(db,'users',u.uid)),getDoc(doc(db,'priv',u.uid))]);
    if(!p.exists()||!v.exists()){await signOut(auth);toast('Profile not found. Please sign up again.');return}
    ME={uid:u.uid,...p.data(),...v.data()};
    const a=age(ME.dob);if(a<18){await signOut(auth);toast('You must be 18 or older to use Frendlie.');return}
    if(a!==ME.age){ME.age=a;updateDoc(doc(db,'users',u.uid),{age:a})}
    tab='home';await boot();await loadAnswers().catch(()=>{});render()}
  catch(e){toast('Could not load your account: '+(e.code||e.message));render()}});

/* ---------- Actions ---------- */
async function sendMsg(t,x){const path=chat?['chats',chat]:['groups',grp];await addDoc(collection(db,...path,'messages'),{from:ME.uid,t,x,ts:serverTimestamp()})}
function markRead(){NOTIFS.filter(n=>!n.read).forEach(n=>updateDoc(doc(db,'notifs',n.id),{read:true}).catch(()=>{}))}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();
  const a=el.dataset.a,v=el.dataset.v;
  try{switch(a){
  case'mode':authMode=v;render();break;
  case'signup':await signup();break;
  case'login':await login();break;
  case'tab':syncP();tab=v;if(v==='home')await loadAnswers().catch(()=>{});render();if(v==='alerts')markRead();break;
  case'tf':showFilters=!showFilters;render();break;
  case'fi':if(filterInt.has(v))filterInt.delete(v);else filterInt.add(v);render();break;
  case'ti':{syncP();const arr=(ME.interests||[]).slice(),i=arr.indexOf(v);
    if(i>=0)arr.splice(i,1);else if(arr.length>=5){toast('You can pick up to 5 interests');break}else arr.push(v);
    ME.interests=arr;render();break}
  case'dqpost':{const t=$('#dq').value.trim();if(!t)return err('Please write an answer first.');
    if(!await guard(t,'#dq'))break;
    await setDoc(doc(db,'answers',dayKey()+'_'+ME.uid),{uid:ME.uid,name:ME.name,av:ME.av,city:ME.city,text:t,day:dayKey(),ts:Date.now()});
    await loadAnswers();render();toast('Answer shared');break}
  case'like':{await setDoc(doc(db,'likes',ME.uid+'_'+v),{from:ME.uid,to:v,ts:serverTimestamp()});MY.likes.add(v);
    const r=await getDocs(query(collection(db,'likes'),where('to','==',ME.uid),where('from','==',v)));
    if(!r.empty){await setDoc(doc(db,'chats',[ME.uid,v].sort().join('_')),{members:[ME.uid,v].sort()});
      notify(v,'match',{}).catch(()=>{});render();modal(`<h2>🎉 It's a match!</h2><p>You and ${esc(P(v).name)} connected. Say hello in Chats.</p>`)}
    else{notify(v,'like',{}).catch(()=>{});render();toast('Connection sent ♥')}break}
  case'pass':await setDoc(doc(db,'passes',ME.uid+'_'+v),{from:ME.uid,to:v});MY.passes.add(v);render();break;
  case'open':chat=v;watch(['chats',v]);render();break;
  case'back':unMsg&&unMsg();unMsg=null;chat=null;MSGS=[];render();break;
  case'send':{const t=$('#t').value.trim();if(t&&await guard(t,'#t')){$('#t').value='';await sendMsg('text',t)}break}
  case'call':await requestCall(v);break;
  case'acall':await acceptCall();break;
  case'dcall':await declineCall();break;
  case'ecall':endCall(true);break;
  case'mute':muteToggle();break;
  case'report':await addDoc(collection(db,'reports'),{from:ME.uid,about:v||'',reason:'Reported from chat',text:'',ts:Date.now()});toast('Thanks, we have noted this report');break;
  case'sendrep':{const t=$('#rt').value.trim();if(!t)return err('Please describe the problem.');
    await addDoc(collection(db,'reports'),{from:ME.uid,about:'',reason:$('#rr').value,text:t.slice(0,500),ts:Date.now()});
    $('#rt').value='';err('');toast('Report sent. Thank you for keeping Frendlie safe.');break}
  case'av':syncP();await updateDoc(doc(db,'users',ME.uid),{av:v,photo:''});ME.av=v;ME.photo='';render();break;
  case'rmph':syncP();await updateDoc(doc(db,'users',ME.uid),{photo:''});ME.photo='';render();break;
  case'savep':syncP();await updateDoc(doc(db,'users',ME.uid),{bio:ME.bio,city:ME.city,show:ME.show,interests:ME.interests||[]});toast('Profile saved');render();break;
  case'pickph':syncP();pickFile('image/*',f=>readImg(f,400,safe(async d=>{if(d.length>190000)return toast('Photo is too large, try another one.');await updateDoc(doc(db,'users',ME.uid),{photo:d});ME.photo=d;render()})));break;
  case'pickcm':pickFile('image/*',f=>readImg(f,500,safe(async d=>{if(d.length>280000)return toast('Photo is too large, try another one.');await sendMsg('img',d)})));break;
  case'logout':await signOut(auth);break;
  case'del':modal('<h2>Delete account?</h2><p>This permanently removes your account and profile.</p><button class="btn w" style="background:#d6204a" data-a="del2">Yes, delete everything</button>','Cancel');break;
  case'del2':{const u=auth.currentUser;
    for(const c of['likes','passes']){const s=await getDocs(query(collection(db,c),where('from','==',ME.uid)));for(const d of s.docs)await deleteDoc(d.ref)}
    await deleteDoc(doc(db,'answers',dayKey()+'_'+ME.uid)).catch(()=>{});
    await deleteDoc(doc(db,'users',ME.uid));await deleteDoc(doc(db,'priv',ME.uid));
    document.querySelectorAll('.modal').forEach(m=>m.remove());
    try{await deleteUser(u)}catch(x){await signOut(auth);toast('Profile deleted. Please sign up again if you want to rejoin.')}
    break}
  case'policy':modal('<h2>Privacy Policy</h2><ul style="padding-left:18px;line-height:1.6"><li>Your email and personal details are never shared with anyone else.</li><li>Only your city is shown. Your exact location is never collected.</li><li>Photos are protected: downloads, right-click and screenshots are blocked where the browser allows it.</li><li>Chats stay between you and the person you match with.</li><li>Voice calls are one-to-one, start only when the other person accepts, and are not recorded or stored.</li><li>Phone numbers, emails and social IDs cannot be shared in chat. Such a message is deleted at once with a warning, and a second attempt pauses your account for 5 minutes.</li><li>Abusive language is deleted and pauses your account for 5 minutes.</li><li>Profiles with a photo get more visibility in Discover.</li><li>Friend groups have up to 4 people: 2 girls and 2 boys.</li><li>You must be 18 or older to join.</li><li>You can delete your account at any time from Profile.</li></ul>');break;
  case'newg':sel=[];gname='';tab='gnew';render();break;
  case'gcancel':tab='groups';render();break;
  case'pick':{gname=$('#gn')?$('#gn').value:gname;const i=sel.indexOf(v);
    if(i>=0)sel.splice(i,1);
    else{const gd=P(v).gender,cnt=g=>sel.filter(id=>P(id).gender===g).length+(ME.gender===g?1:0);
      if(sel.length>=3)toast('A group can have 4 people including you');
      else if((gd==='Woman'||gd==='Man')&&cnt(gd)>=2)toast('Max 2 '+(gd==='Woman'?'girls':'boys')+' per group');
      else sel.push(v)}
    render();break}
  case'gmake':{gname=$('#gn').value.trim();if(!sel.length)return err('Pick at least one friend.');
    const r=await addDoc(collection(db,'groups'),{name:gname||'My group',owner:ME.uid,members:[ME.uid,...sel],game:{turn:0,card:''}});
    sel.forEach(u=>notify(u,'group',{}).catch(()=>{}));
    grp=r.id;tab='groups';watch(['groups',grp]);render();break}
  case'opg':grp=v;watch(['groups',v]);render();break;
  case'gback':unMsg&&unMsg();unMsg=null;grp=null;MSGS=[];render();break;
  case'gsend':{const t=$('#gt').value.trim();if(t&&await guard(t,'#gt')){$('#gt').value='';await sendMsg('text',t)}break}
  case'tod':{const L={truth:TRUTHS,dare:DARES,wyr:WYR,ice:DAILYQ}[v],lab={truth:'Truth',dare:'Dare',wyr:'Would you rather',ice:'Icebreaker'}[v];
    await updateDoc(doc(db,'groups',grp),{'game.card':lab+': '+L[Math.random()*L.length|0]});break}
  case'nxt':{const g=GROUPS.find(x=>x.id===grp);await updateDoc(doc(db,'groups',grp),{'game.turn':g.game.turn+1,'game.card':''});break}
  case'close':el.closest('.modal').remove();break}
  }catch(x){toast('Error: '+(x.code||x.message))}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target.value?e.target.value.trim():'';
  if(e.target.id==='t'&&t)$('[data-a=send]').click();if(e.target.id==='gt'&&t)$('[data-a=gsend]').click()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.prot'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.prot'))e.preventDefault()});
window.addEventListener('blur',()=>document.body.classList.add('away'));
window.addEventListener('focus',()=>document.body.classList.remove('away'));
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('away',document.hidden));
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(x){}}});
window.addEventListener('beforeunload',()=>{if(call)endCall(true)});
$('#app').innerHTML=`${logoTop()}<p style="text-align:center;color:#fff">Loading...</p>`;
</script>
</body>
</html>
